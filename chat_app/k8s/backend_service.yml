apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: chat-app
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000        # Service port
      targetPort: 8000  # Container port
      nodePort: 30008   # Exposes the service externally(avoids port-forward) &  type: ClusterIP before apply kubectl port-forward
  type: NodePort
